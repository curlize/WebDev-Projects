<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebDev Projects</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;1,400&family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root { --navy:#0b1426; --gold:#d4af37; --text:#f4f1ea; --muted:rgba(244,241,234,.6); }
    body { background:var(--navy); color:var(--text); font-family:"Inter",system-ui,sans-serif; }
    .back-link { color:var(--muted); text-decoration:none; font-size:.85rem; transition:color .2s; }
    .back-link:hover { color:var(--gold); }
    .page-title { font-family:"Fraunces",Georgia,serif; font-weight:500; font-size:clamp(2rem,5.5vw,4rem); line-height:1.1; max-width:14ch; }
    .page-title em { color:var(--gold); font-weight:400; }
    .page-sub { color:var(--muted); max-width:52ch; }

    .proj-tile {
      display:block; height:100%; padding:1.5rem; border-radius:1rem; text-decoration:none; color:inherit;
      background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.1);
      transition:border-color .25s, background .25s;
    }
    .proj-tile:hover { border-color:var(--gold); background:rgba(255,255,255,.07); color:inherit; }
    .proj-tile .num { font-family:"Fraunces",serif; color:var(--gold); font-size:1.25rem; }
    .proj-tile h2 { font-family:"Fraunces",serif; font-weight:500; font-size:1.6rem; margin:.5rem 0; }
    .proj-tile p { color:var(--muted); font-size:.9rem; }
    .proj-tile .tags span { font-size:.7rem; padding:.25rem .7rem; border-radius:99px; border:1px solid rgba(255,255,255,.2); color:var(--muted); margin-right:.3rem; }
    .proj-tile .open { color:var(--gold); font-size:.85rem; font-weight:600; }
    .page-foot { color:var(--muted); font-size:.8rem; border-top:1px solid rgba(255,255,255,.08); }
  </style>
</head>
<body>

  <nav class="container-fluid px-4 px-lg-5 py-4 d-flex justify-content-between">
    <!-- TODO: replace with the link to your main portfolio website -->
    <a href="https://curlize.github.io/" class="back-link">&larr; Back to portfolio</a>
    <a href="https://github.com/curlize/WebDev-Projects" target="_blank" rel="noopener noreferrer" class="back-link">View on GitHub</a>
  </nav>

  <header class="container-fluid px-4 px-lg-5 pt-4 pb-5">
    <h1 class="page-title mb-3">My web dev <em>projects.</em></h1>
    <p class="page-sub mb-0">Every activity for this course lives here, one folder per project.</p>
  </header>

  <main class="container-fluid px-4 px-lg-5 pb-5">
    <div class="row g-3">

      <!-- PROJECT 01 -->
      <div class="col-12 col-md-6 col-xl-4">
        <a href="bento-gallery/" class="proj-tile">
          <span class="num">01</span>
          <h2>Bento Gallery</h2>
          <p>A responsive photo gallery in a bento layout, built with Bootstrap.</p>
          <div class="tags mb-3"><span>HTML</span><span>CSS</span><span>Bootstrap</span></div>
          <span class="open">Open project &rarr;</span>
        </a>
      </div>

      <!-- Future projects: copy the block above, change the folder link and text -->

    </div>
  </main>

  <footer class="container-fluid px-4 px-lg-5 py-4 page-foot">Charlize Mojares &middot; WebDev Projects</footer>

</body>
</html>
