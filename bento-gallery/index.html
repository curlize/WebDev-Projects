<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bento Gallery | WebDev Projects</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;1,400&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <!-- Your styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top bar -->
  <nav class="container-fluid px-4 px-lg-5 py-4 d-flex justify-content-between align-items-center">
    <!-- TODO: replace with the link to your main portfolio website -->
    <a href="../" class="back-link">&larr; All web dev projects</a>
    <a href="https://github.com/curlize/WebDev-Projects" target="_blank" rel="noopener noreferrer" class="back-link">View on GitHub</a>
  </nav>

  <!-- Header -->
  <header class="container-fluid px-4 px-lg-5 pt-4 pb-5">
    <h1 class="page-title">A bento gallery of <em>things I like.</em></h1>
    <p class="page-sub">Built with Bootstrap's grid. Tiles of different sizes rearrange smoothly from desktop to mobile. Tap any photo to enlarge it.</p>
  </header>

  <!-- Gallery -->
  <main class="container-fluid px-4 px-lg-5 pb-5">
    <div class="row g-3 bento">

      <!-- Tall feature tile -->
      <div class="col-12 col-md-5">
        <figure class="bento-tile bento-tall">
          <img src="images/bento-1.jpg" alt="Describe photo 1" loading="lazy">
          <figcaption>Photo title 1</figcaption>
        </figure>
      </div>

      <!-- Wide tile + two squares -->
      <div class="col-12 col-md-7">
        <div class="row g-3">
          <div class="col-12">
            <figure class="bento-tile bento-short">
              <img src="images/bento-2.jpg" alt="Describe photo 2" loading="lazy">
              <figcaption>Photo title 2</figcaption>
            </figure>
          </div>
          <div class="col-6">
            <figure class="bento-tile bento-short">
              <img src="images/bento-3.jpg" alt="Describe photo 3" loading="lazy">
              <figcaption>Photo title 3</figcaption>
            </figure>
          </div>
          <div class="col-6">
            <figure class="bento-tile bento-short">
              <img src="images/bento-4.jpg" alt="Describe photo 4" loading="lazy">
              <figcaption>Photo title 4</figcaption>
            </figure>
          </div>
        </div>
      </div>

      <!-- Bottom row -->
      <div class="col-6 col-md-3">
        <figure class="bento-tile bento-short">
          <img src="images/bento-5.jpg" alt="Describe photo 5" loading="lazy">
          <figcaption>Photo title 5</figcaption>
        </figure>
      </div>
      <div class="col-6 col-md-3">
        <figure class="bento-tile bento-short">
          <img src="images/bento-6.jpg" alt="Describe photo 6" loading="lazy">
          <figcaption>Photo title 6</figcaption>
        </figure>
      </div>
      <div class="col-12 col-md-6">
        <figure class="bento-tile bento-short">
          <img src="images/bento-7.jpg" alt="Describe photo 7" loading="lazy">
          <figcaption>Photo title 7</figcaption>
        </figure>
      </div>

    </div>
  </main>

  <footer class="container-fluid px-4 px-lg-5 py-4 page-foot">
    Charlize Mojares &middot; WebDev Projects
  </footer>

  <!-- Lightbox -->
  <div class="modal fade" id="lightbox" tabindex="-1" aria-label="Photo preview" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-xl">
      <div class="modal-content bg-transparent border-0">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <span id="lightboxCaption" class="text-white-50 small"></span>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="position-relative">
          <img id="lightboxImg" src="" alt="" class="img-fluid rounded-4 mx-auto d-block" style="max-height:78vh;">
          <button type="button" class="lb-nav lb-prev" id="lbPrev" aria-label="Previous photo">&#8249;</button>
          <button type="button" class="lb-nav lb-next" id="lbNext" aria-label="Next photo">&#8250;</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
